<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Skin visual regression preview</title>
<style>
    :root {
        --bg: #ffffff;
        --bg-alt: #f7f7f7;
        --fg: #111820;
        --fg-muted: #5f6b76;
        --border: #d8dde3;
        --accent: #3665f3;
        --added: #1a7f37;
        --removed: #cf222e;
        --changed: #9a6700;
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #16191d;
            --bg-alt: #1f242a;
            --fg: #e8ebee;
            --fg-muted: #98a3ad;
            --border: #333a42;
            --accent: #7ea0ff;
            --added: #4ac26b;
            --removed: #ff7b72;
            --changed: #d4a72c;
        }
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font: 14px/1.45 system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
        display: grid;
        grid-template-columns: 300px 1fr;
        grid-template-rows: auto 1fr;
        height: 100vh;
    }
    header {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        flex-wrap: wrap;
    }
    header h1 { font-size: 15px; margin: 0; }
    header .meta { color: var(--fg-muted); font-size: 12px; }
    nav {
        border-right: 1px solid var(--border);
        overflow-y: auto;
        padding: 8px 0;
        background: var(--bg-alt);
    }
    nav h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--fg-muted);
        margin: 12px 12px 4px;
    }
    nav button {
        display: flex;
        width: 100%;
        align-items: center;
        gap: 6px;
        padding: 5px 12px;
        border: 0;
        background: none;
        color: var(--fg);
        text-align: left;
        cursor: pointer;
        font: inherit;
        font-size: 13px;
    }
    nav button:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
    nav button.active { background: color-mix(in srgb, var(--accent) 20%, transparent); }
    nav .story-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chip {
        font-size: 10.5px;
        padding: 0 6px;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--fg-muted);
        flex: none;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .dot.changed { background: var(--changed); }
    .dot.added { background: var(--added); }
    .dot.removed { background: var(--removed); }
    main { overflow: auto; padding: 16px; }
    .toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 12px;
        flex-wrap: wrap;
    }
    .toolbar .spacer { flex: 1; }
    .seg {
        display: inline-flex;
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
    }
    .seg button {
        border: 0;
        background: none;
        color: var(--fg);
        padding: 5px 12px;
        cursor: pointer;
        font: inherit;
        font-size: 13px;
    }
    .seg button.active { background: var(--accent); color: #fff; }
    .panes { display: flex; gap: 16px; align-items: flex-start; overflow-x: auto; }
    .pane { flex: none; }
    .pane h3 {
        margin: 0 0 6px;
        font-size: 12px;
        color: var(--fg-muted);
        font-weight: 600;
    }
    .pane iframe {
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #fff;
        display: block;
    }
    pre.diff {
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 12px;
        overflow-x: auto;
        font: 12px/1.5 ui-monospace, monospace;
        background: var(--bg-alt);
    }
    pre.diff .add { color: var(--added); }
    pre.diff .del { color: var(--removed); }
    pre.diff .hunk { color: var(--accent); }
    .empty-state { color: var(--fg-muted); padding: 48px; text-align: center; }
    footer.note {
        grid-column: 1 / -1;
        color: var(--fg-muted);
        font-size: 11.5px;
        padding: 6px 16px;
        border-top: 1px solid var(--border);
    }
</style>
</head>
<body>
<header>
    <h1>Skin visual regression preview</h1>
    <span class="meta" id="summary"></span>
</header>
<nav id="nav"></nav>
<main id="main"><div class="empty-state">Select a changed story</div></main>
<footer class="note">
    Rendered from visual-html snapshots with token CSS applied; icon sprites
    are not embedded (matches Storybook), and animations are static.
</footer>
<script>
    const DATA = /*__DATA__*/;
    const TOKENS_LIGHT = /*__TOKENS_LIGHT__*/;
    const TOKENS_DARK = /*__TOKENS_DARK__*/;

    const state = { entry: null, view: "rendered", theme: "light" };

    const summaryEl = document.getElementById("summary");
    const navEl = document.getElementById("nav");
    const mainEl = document.getElementById("main");

    const componentCount = new Set(DATA.entries.map((e) => e.component)).size;
    summaryEl.textContent =
        DATA.entries.length +
        " changed section(s) across " +
        componentCount +
        " component(s), " +
        DATA.unchangedSections +
        " unchanged — vs " +
        DATA.baseRefShort;

    function esc(s) {
        return s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
    }

    function buildNav() {
        navEl.textContent = "";
        const byComponent = new Map();
        for (const e of DATA.entries) {
            if (!byComponent.has(e.component)) byComponent.set(e.component, []);
            byComponent.get(e.component).push(e);
        }
        for (const [component, entries] of byComponent) {
            const h = document.createElement("h2");
            h.textContent = component;
            navEl.appendChild(h);
            let lastFile = null;
            for (const entry of entries) {
                if (entry.file !== lastFile && entries.some((e) => e.file !== entry.file)) {
                    lastFile = entry.file;
                    const fh = document.createElement("h2");
                    fh.style.textTransform = "none";
                    fh.style.letterSpacing = "0";
                    fh.style.marginTop = "6px";
                    fh.textContent =
                        "· " + entry.file.replace(/^.*stories\//, "").replace("__snapshots__/", "");
                    navEl.appendChild(fh);
                }
                const b = document.createElement("button");
                const dot = document.createElement("span");
                dot.className = "dot " + entry.status;
                dot.title = entry.status;
                const name = document.createElement("span");
                name.className = "story-name";
                name.textContent = entry.story;
                b.append(dot, name);
                const width = document.createElement("span");
                width.className = "chip";
                width.textContent = entry.width + "px";
                b.appendChild(width);
                if (entry.rtl) {
                    const rtl = document.createElement("span");
                    rtl.className = "chip";
                    rtl.textContent = "RTL";
                    b.appendChild(rtl);
                }
                b.onclick = () => {
                    state.entry = entry;
                    render();
                };
                entry._btn = b;
                navEl.appendChild(b);
            }
        }
    }

    function frameDoc(snapshotHtml, entry) {
        const dark = state.theme === "dark"
            ? "<style>" + TOKENS_DARK + "</style>"
            : "";
        return (
            '<!doctype html><html dir="' + (entry.rtl ? "rtl" : "ltr") + '">' +
            "<head><style>" + TOKENS_LIGHT + "</style>" + dark +
            "<style>body{margin:16px;background:var(--color-background-primary,#fff);" +
            "color:var(--color-foreground-primary,#111);" +
            'font-family:"Market Sans",Arial,sans-serif}</style></head><body>' +
            snapshotHtml +
            "</body></html>"
        );
    }

    function renderPane(title, html, entry) {
        const pane = document.createElement("div");
        pane.className = "pane";
        const h = document.createElement("h3");
        h.textContent = title;
        pane.appendChild(h);
        if (html === "") {
            const p = document.createElement("p");
            p.textContent = "(not present)";
            pane.appendChild(p);
            return pane;
        }
        const iframe = document.createElement("iframe");
        iframe.style.width = entry.width + "px";
        iframe.style.height = "160px";
        iframe.onload = () => {
            const doc = iframe.contentDocument;
            iframe.style.height =
                Math.min(Math.max(doc.documentElement.scrollHeight, 120), 800) +
                "px";
        };
        iframe.srcdoc = frameDoc(html, entry);
        pane.appendChild(iframe);
        return pane;
    }

    function renderDiff(entry) {
        const pre = document.createElement("pre");
        pre.className = "diff";
        pre.innerHTML = entry.diff
            .split("\n")
            .map((line) => {
                const cls = line.startsWith("+")
                    ? "add"
                    : line.startsWith("-")
                      ? "del"
                      : line.startsWith("@@")
                        ? "hunk"
                        : "";
                return cls
                    ? '<span class="' + cls + '">' + esc(line) + "</span>"
                    : esc(line);
            })
            .join("\n");
        return pre;
    }

    function segment(options, current, onPick) {
        const seg = document.createElement("div");
        seg.className = "seg";
        for (const opt of options) {
            const b = document.createElement("button");
            b.textContent = opt.label;
            if (opt.value === current) b.className = "active";
            b.onclick = () => onPick(opt.value);
            seg.appendChild(b);
        }
        return seg;
    }

    function render() {
        for (const e of DATA.entries) {
            if (e._btn) e._btn.className = e === state.entry ? "active" : "";
        }
        mainEl.textContent = "";
        const entry = state.entry;
        if (!entry) {
            mainEl.innerHTML = '<div class="empty-state">Select a changed story</div>';
            return;
        }
        const toolbar = document.createElement("div");
        toolbar.className = "toolbar";
        toolbar.appendChild(
            segment(
                [
                    { label: "Rendered", value: "rendered" },
                    { label: "Diff", value: "diff" },
                ],
                state.view,
                (v) => { state.view = v; render(); },
            ),
        );
        toolbar.appendChild(
            segment(
                [
                    { label: "Light", value: "light" },
                    { label: "Dark", value: "dark" },
                ],
                state.theme,
                (v) => { state.theme = v; render(); },
            ),
        );
        const spacer = document.createElement("div");
        spacer.className = "spacer";
        toolbar.appendChild(spacer);
        const file = document.createElement("span");
        file.className = "meta";
        file.style.color = "var(--fg-muted)";
        file.style.fontSize = "12px";
        file.textContent = entry.file;
        toolbar.appendChild(file);
        mainEl.appendChild(toolbar);

        if (state.view === "diff") {
            mainEl.appendChild(renderDiff(entry));
            return;
        }
        const panes = document.createElement("div");
        panes.className = "panes";
        panes.appendChild(renderPane("Base (" + DATA.baseRefShort + ")", entry.before, entry));
        panes.appendChild(renderPane("Current", entry.after, entry));
        mainEl.appendChild(panes);
    }

    buildNav();
    if (DATA.entries.length === 0) {
        mainEl.innerHTML =
            '<div class="empty-state">No visual snapshot changes vs ' +
            DATA.baseRefShort +
            "</div>";
    } else {
        state.entry = DATA.entries[0];
        render();
    }
</script>
</body>
</html>
