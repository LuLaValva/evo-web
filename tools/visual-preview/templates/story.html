<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>__TITLE__</title>
<link rel="stylesheet" href="../assets/viewer.css" />
</head>
<body class="story-page">
<header>
    <a class="back" href="../index.html">← All changes</a>
    <h1 id="title">__H1__</h1>
    <span class="meta" id="path">__PATH__</span>
    <span class="pagenav">
        <a id="prev" href="#">‹ prev</a>
        <span class="pos" id="pos"></span>
        <a id="next" href="#">next ›</a>
    </span>
</header>
<nav id="sidebar">
    <input id="search" type="search" placeholder="Filter stories… ( / )" />
    <div id="storylist"></div>
</nav>
<main id="main">
    <div class="toolbar">
        <div class="seg" data-seg="mode">
            <button type="button" data-v="side" class="active">Side by side</button>
            <button type="button" data-v="swipe">Swipe</button>
            <button type="button" data-v="onion">Onion</button>
            <button type="button" data-v="flip">Flip</button>
        </div>
        <div class="seg" data-seg="view">
            <button type="button" data-v="rendered" class="active">Rendered</button>
            <button type="button" data-v="diff">Text diff</button>
        </div>
        <div class="seg" data-seg="theme">
            <button type="button" data-v="light" class="active">Light</button>
            <button type="button" data-v="dark">Dark</button>
        </div>
        <label class="toggle"><input type="checkbox" id="hl-toggle" />Highlights</label>
        <div class="grow"></div>
        <button class="flag" id="flag-btn" type="button">⚑ Flag</button>
    </div>
    __MAIN__
</main>
<footer class="note">
    <span class="kbd-hint"><kbd>j</kbd>/<kbd>k</kbd> prev/next story</span>
    <span class="kbd-hint"><kbd>m</kbd> compare mode</span>
    <span class="kbd-hint"><kbd>f</kbd> flip (in flip mode)</span>
    <span class="kbd-hint"><kbd>t</kbd> theme</span>
    <span class="kbd-hint"><kbd>h</kbd> highlights</span>
    <span class="kbd-hint"><kbd>d</kbd> text diff</span>
    <span class="kbd-hint"><kbd>x</kbd> flag</span>
    <span class="kbd-hint"><kbd>/</kbd> filter</span>
    <span style="margin-left:auto">Stories render with each ref's real CSS; animations run live.</span>
</footer>
<script>
    const PAGE = /*__PAGE__*/;
</script>
<script src="../assets/nav.js" defer></script>
<script src="../assets/story.js" defer></script>
<script src="../assets/prefetch.js" defer></script>
</body>
</html>
