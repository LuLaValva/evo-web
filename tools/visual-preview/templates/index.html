<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Skin visual regression review</title>
<link rel="stylesheet" href="assets/viewer.css" />
</head>
<body>
<header>
    <h1>Visual regression review</h1>
    <span class="meta">__SUMMARY__</span>
    <span class="progress" id="progress"></span>
</header>
<input id="search" type="search" placeholder="Filter stories… ( / )" />
<main style="padding:0">
    <div id="storylist">__LIST__</div>
</main>
<footer class="note">
    <span class="kbd-hint"><kbd>j</kbd>/<kbd>k</kbd> move · <kbd>Enter</kbd> open · <kbd>/</kbd> filter</span>
    <span>Each story is its own page — share its URL to link a specific diff. Opening a page marks it viewed (and your browser dims visited links); use ⚑ on a page to flag it for follow-up.</span>
</footer>
<script>
    "use strict";
    // Viewed/flagged state written by the story pages; keyed by slug and
    // stamped with a content hash so stale marks (diff changed on a later
    // push) don't count.
    function readStore(key) {
        try { return JSON.parse(localStorage.getItem(key)) || {}; } catch { return {}; }
    }
    const viewed = readStore("vp:viewed");
    const flags = readStore("vp:flags");
    const rows = [...document.querySelectorAll("a.story")];
    let nViewed = 0, nFlagged = 0;
    for (const row of rows) {
        const { slug, hash } = row.dataset;
        if (viewed[slug] === hash) { row.classList.add("viewed"); nViewed++; }
        if (flags[slug] === hash) { row.classList.add("flagged"); nFlagged++; }
    }
    document.getElementById("progress").innerHTML =
        "<b>" + nViewed + "</b> / " + rows.length + " viewed" +
        (nFlagged ? " · <b>" + nFlagged + "</b> ⚑ flagged" : "");

    const searchEl = document.getElementById("search");
    function applyFilter() {
        const f = searchEl.value.trim().toLowerCase();
        for (const row of rows) {
            row.style.display = !f || row.dataset.text.includes(f) ? "" : "none";
        }
        for (const h of document.querySelectorAll("#storylist h2")) {
            let el = h.nextElementSibling;
            let any = false;
            while (el && el.tagName !== "H2") {
                if (el.style.display !== "none") { any = true; break; }
                el = el.nextElementSibling;
            }
            h.style.display = any ? "" : "none";
        }
    }
    searchEl.oninput = applyFilter;
    document.addEventListener("keydown", (e) => {
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        if (e.target === searchEl) {
            if (e.key === "Escape") { searchEl.value = ""; applyFilter(); searchEl.blur(); }
            return;
        }
        if (e.target?.closest?.("input, textarea, select, [contenteditable]")) return;
        const visible = rows.filter((r) => r.style.display !== "none");
        const idx = visible.indexOf(document.activeElement);
        if (e.key === "j" || e.key === "ArrowDown") {
            e.preventDefault();
            (visible[Math.min(idx + 1, visible.length - 1)] ?? visible[0])?.focus();
        } else if (e.key === "k" || e.key === "ArrowUp") {
            e.preventDefault();
            visible[idx === -1 ? 0 : Math.max(idx - 1, 0)]?.focus();
        } else if (e.key === "/") {
            e.preventDefault();
            searchEl.focus();
        }
    });
</script>
</body>
</html>
